version: "3.3"
services:
  postgres:
    image: postgres:16-alpine
    container_name: immo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=immo_db
      - POSTGRES_USER=immo_user
      - POSTGRES_PASSWORD=immo_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - immo_network
  api:
    build: .
    container_name: immo_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://immo_user:immo_password_2024@postgres:5432/immo_db
      - AUTO_CREATE_TABLES=true
      - DEBUG=false
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-before-production}
      - SMS_WEBHOOK_URL=${SMS_WEBHOOK_URL:-}
      - SMS_WEBHOOK_TOKEN=${SMS_WEBHOOK_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - public_uploads:/app/uploads
      - private_uploads:/app/private_uploads
      - backups:/app/backups
    networks:
      - immo_network
volumes:
  postgres_data:
  public_uploads:
  private_uploads:
  backups:
networks:
  immo_network:
    driver: bridge
